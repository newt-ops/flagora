services:
  - type: web
    name: flagora-server
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build:server
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: flagora_bot
      - key: BOT_USERNAME
        value: flagora_bot
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        value: memory
      - key: CLIENT_URL
        value: https://flagora-delta.vercel.app
